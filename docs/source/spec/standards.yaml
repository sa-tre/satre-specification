# Controlled vocabulary for external standards referenced by SATRE requirement tags.
#
# The `name` values here are the canonical framework names. Any `framework` value
# used in the `standards` tag of a requirement in specification.yaml (or in the
# authoring spreadsheet) MUST match one of these `name` values exactly.
#
# To add a new standard, add an entry here. `id` is a stable slug used by the site
# JavaScript and CSS; `name` is the human-readable, canonical framework name.
standards:
  - id: iso-27001
    name: ISO 27001
    url: https://www.iso.org/standard/27001
  - id: nhs-dspt
    name: NHS DSPT
    url: https://www.dsptoolkit.nhs.uk/
  - id: cyber-essentials-plus
    name: Cyber Essentials Plus
    url: https://www.ncsc.gov.uk/cyberessentials/overview
  - id: digital-economy-act
    name: Digital Economy Act
    url: https://www.legislation.gov.uk/ukpga/2017/30/contents
  - id: nhs-sde-spec
    name: NHS Secure Data Environment Specification
    url: https://digital.nhs.uk/services/secure-data-environment-service

# Allowed enumeration values for pattern/product tags. Validated by process_tags.py.
coverage:
  - full
  - partial

# Allowed status values for pattern tags (patterns are documentation, not built
# technology, so they use a document lifecycle status rather than a TRL).
status:
  - draft
  - published

# Products use maturity, expressed as a Technology Readiness Level (TRL), an integer
# 1-9. Labels are informational (for tooltips / the reference sheet); process_tags.py
# validates that a maturity value is an integer within `values`.
maturity:
  values: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  labels:
    1: Basic principles observed
    2: Technology concept formulated
    3: Experimental proof of concept
    4: Technology validated in lab
    5: Technology validated in relevant environment
    6: Technology demonstrated in relevant environment
    7: System prototype demonstration in operational environment
    8: System complete and qualified
    9: Actual system proven in operational environment
